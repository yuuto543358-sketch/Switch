<rect x="600" y="760" width="720" height="50" fill="#4a4d50"/><rect x="600" y="760" width="720" height="4" fill="#8a8d90"/>
<rect x="640" y="720" width="640" height="44" fill="#55585b"/><rect x="640" y="720" width="640" height="4" fill="#9a9da0"/>
<path d="M680 720 V300 Q960 250 1240 300 V720Z" fill="url(#stone)"/><path d="M680 720 V300 Q960 250 1240 300 V720Z" filter="url(#speck)" opacity=".7"/>
<path d="M680 720 V300 Q960 250 1240 300 V720Z" fill="url(#lampL)"/><path d="M680 720 V300 Q960 250 1240 300 V720Z" fill="url(#lampR)"/>

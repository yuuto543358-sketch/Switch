<rect x="1226" y="150" width="150" height="70" rx="5" fill="#15171a"/><rect x="1226" y="150" width="150" height="2" fill="#5b5e63"/>
<!-- 鍵箱 -->
<rect x="1560" y="486" width="200" height="130" rx="3" fill="#aeb0a6" stroke="#77796f" stroke-width="2"/><rect x="1654" y="536" width="12" height="30" rx="2" fill="#55585a"/>


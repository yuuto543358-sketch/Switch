  <ellipse cx="560" cy="708" rx="84" ry="14" fill="#141a26"/>
  <path d="M490 706 q0 -52 70 -52 t70 52 q-70 14 -140 0z" fill="#1c2434"/><path d="M490 700 q70 14 140 0" fill="none" stroke="#c9a94a" stroke-width="4"/>

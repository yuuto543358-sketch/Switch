<rect width="1920" height="34" fill="#55585a"/><rect y="30" width="1920" height="6" fill="#2f3234"/>
<g><path d="M500 34v40M1420 34v40" stroke="#3a3d41" stroke-width="6"/><path d="M440 110 L470 70 H530 L560 110Z" fill="#2f3234"/><path d="M1360 110 L1390 70 H1450 L1480 110Z" fill="#2f3234"/></g>

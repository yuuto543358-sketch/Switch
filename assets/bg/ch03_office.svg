<rect x="774" y="600" width="172" height="74" rx="4" fill="#000" opacity=".3" filter="url(#b4)" transform="translate(0 5)"/>
<rect x="774" y="600" width="172" height="74" rx="4" fill="url(#box)"/><rect x="774" y="600" width="172" height="2" fill="#6b6e73"/>
<text x="860" y="664" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b9bcc0">カメラ切替</text>

<!-- 案内表示の盤（表示・スイッチはゲーム側） -->
<rect x="1500" y="250" width="330" height="190" rx="5" fill="#000" opacity=".3" filter="url(#b8)" transform="translate(0 8)"/>
<rect x="1500" y="250" width="330" height="190" rx="5" fill="url(#steel)"/><rect x="1500" y="250" width="330" height="190" rx="5" filter="url(#hair)" opacity=".2"/>
<rect x="1500" y="250" width="330" height="190" rx="5" fill="none" stroke="#6e7173"/>
<rect x="1516" y="266" width="298" height="86" fill="#07080a"/>

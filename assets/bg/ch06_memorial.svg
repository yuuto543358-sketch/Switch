<g stroke="#3d3f3c" stroke-width="2" opacity=".7"><path d="M0 760H1920M0 812H1920M0 880H1920M0 968H1920"/><path d="M192 720 L-672 1080"/><path d="M320 720 L-400 1080"/><path d="M448 720 L-128 1080"/><path d="M576 720 L144 1080"/><path d="M704 720 L416 1080"/><path d="M832 720 L688 1080"/><path d="M960 720 L960 1080"/><path d="M1088 720 L1232 1080"/><path d="M1216 720 L1504 1080"/><path d="M1344 720 L1776 1080"/><path d="M1472 720 L2048 1080"/><path d="M1600 720 L2320 1080"/><path d="M1728 720 L2592 1080"/></g>
<rect y="720" width="1920" height="360" fill="url(#lampL)"/><rect y="720" width="1920" height="360" fill="url(#lampR)"/>
<rect y="716" width="1920" height="8" fill="#2a2c2a"/>

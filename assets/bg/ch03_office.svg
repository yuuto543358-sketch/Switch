<g fill="#aeb4b8"><rect x="450" y="900" width="60" height="8" rx="3"/><rect x="970" y="900" width="60" height="8" rx="3"/><rect x="1580" y="900" width="60" height="8" rx="3"/></g>
<rect x="0" y="790" width="250" height="290" fill="#6f6e66"/><rect x="0" y="790" width="250" height="290" filter="url(#speck)" opacity=".5"/><rect x="0" y="786" width="250" height="8" fill="#4a4a44"/>

<!-- 放送卓（マイク・ランプはゲーム側） -->
<rect x="1150" y="634" width="330" height="92" rx="5" fill="#000" opacity=".3" filter="url(#b8)" transform="translate(0 8)"/>
<path d="M1150 726 L1168 640 H1462 L1480 726Z" fill="url(#box)"/><path d="M1168 640H1462" stroke="#6b6e73" stroke-width="2"/>

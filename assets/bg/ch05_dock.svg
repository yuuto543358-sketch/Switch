<rect x="1384" y="408" width="116" height="150" rx="4" fill="#000" opacity=".3" filter="url(#b4)"/>
<rect x="1380" y="400" width="116" height="150" rx="4" fill="url(#steel)"/><rect x="1380" y="400" width="116" height="150" rx="4" filter="url(#hair)" opacity=".2"/><rect x="1380" y="400" width="116" height="150" rx="4" fill="none" stroke="#55585a"/>

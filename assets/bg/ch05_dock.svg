  <rect x="930" y="470" width="60" height="70" fill="#9fd0c0" opacity=".55"/><ellipse cx="960" cy="520" rx="170" ry="150" fill="#9fd0c0" opacity=".12" filter="url(#b40)"/>
  <g stroke="#55585a" stroke-width="5"><path d="M700 300 L820 360M700 330 L820 380M1220 300 L1100 360M1220 330 L1100 380"/></g>
</g>

  <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdd0d1"/><stop offset="1" stop-color="#85888b"/></linearGradient>
  <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4ee"/><stop offset="1" stop-color="#d4d4ca"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2fff4" stop-opacity=".32"/><stop offset="1" stop-color="#f2fff4" stop-opacity="0"/></linearGradient>
  <pattern id="tile" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#e3e1d6"/><rect width="60" height="2" fill="#aeab9f"/><rect width="2" height="60" fill="#aeab9f"/><rect x="2" y="2" width="58" height="2" fill="#f4f2e8"/></pattern>

  <pattern id="tile" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#e3e1d6"/><rect width="60" height="2" fill="#aeab9f"/><rect width="2" height="60" fill="#aeab9f"/><rect x="2" y="2" width="58" height="2" fill="#f4f2e8"/></pattern>

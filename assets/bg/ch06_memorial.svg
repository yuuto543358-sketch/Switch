<g fill="#0a0e0c"><ellipse cx="200" cy="520" rx="260" ry="200"/><ellipse cx="520" cy="560" rx="200" ry="160"/><ellipse cx="1420" cy="560" rx="210" ry="170"/><ellipse cx="1760" cy="520" rx="250" ry="210"/></g>
<g fill="#1a221c" opacity=".7"><ellipse cx="420" cy="600" rx="220" ry="130"/><ellipse cx="1500" cy="600" rx="230" ry="130"/></g>

<path d="M830 250V200H900V250" fill="#55585a"/><rect x="800" y="186" width="130" height="18" rx="3" fill="#6e7173"/>
<rect x="606" y="246" width="508" height="320" rx="8" fill="url(#box)"/><rect x="606" y="246" width="508" height="3" rx="1" fill="#6b6e73"/>

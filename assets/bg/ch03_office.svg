<rect x="250" y="700" width="1670" height="60" fill="#000" opacity=".22" filter="url(#b16)"/>
<path d="M250 760 L330 700 H1920 V760Z" fill="url(#desk)"/><path d="M330 700H1920" stroke="#e9e7db" stroke-width="2"/>
<rect x="250" y="760" width="1670" height="320" fill="url(#deskF)"/><rect x="250" y="760" width="1670" height="320" filter="url(#stain)" opacity=".3"/>
<rect x="250" y="760" width="1670" height="8" fill="#3d4347"/><rect x="250" y="768" width="1670" height="30" fill="#000" opacity=".25" filter="url(#b8)"/>
